{% extends "base.html" %}
{% block content %}
<section class="wrap account-shell" aria-labelledby="account-heading">
  <div class="account-heading">
    <h1 id="account-heading">حساب من</h1>
  </div>
  <dl class="account-identity">
    <dt>نام کاربری</dt>
    <dd><bdi>{{ user.get_username }}</bdi></dd>
  </dl>
  <div class="account-actions">
    <a class="button" href="{% url 'shop' %}">مشاهده محصولات {% include "partials/icon.html" with name="arrow" %}</a>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button class="button button-outline" type="submit">خروج از حساب</button>
    </form>
  </div>
</section>
{% endblock %}
