{% extends "base.html" %}
{% block og_type %}article{% endblock %}
{% block content %}
<article class="wrap page-shell">
  <nav class="breadcrumbs" aria-label="مسیر صفحه"><a href="{% url 'home' %}">خانه</a><span>/</span><a href="{% url 'journal' %}">مجله فرما</a></nav>
  <div class="page-heading" data-enter><div><h1>{{ article.title }}</h1><p>{{ article.summary }}</p></div></div>
  <div class="article-layout{% if article.image %} article-illustrated{% endif %}">
    {% if article.image %}<img class="editorial-cover" src="{{ article.image.url }}" alt="" fetchpriority="high">{% endif %}
    <div class="editorial-body">
      <div class="prose">{{ article.body|linebreaks }}</div>
      <a class="text-link" href="{% url 'journal' %}">مطالب مجله فرما {% include "partials/icon.html" with name="arrow" %}</a>
    </div>
  </div>
</article>
{% endblock %}
